# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: mizan-postgres
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan_dev
    ports:
      - "5432:5432"
    volumes:
      - mizan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan -d mizan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mizan-postgres-data:
